<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91岁生日倒计时</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .app{width:360px;height:360px;padding:20px;border:1px solid #eee;border-radius:12px;display:flex;flex-direction:column}
    .nav{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;margin-bottom:12px}
    .logo{width:24px;height:24px;border-radius:6px;background:#f57c00}
    .user{font-size:12px;color:#888}
    .user strong{color:#333;font-weight:500}
    .hero{text-align:center;margin-bottom:12px}
    .title{font-size:14px;font-weight:500;margin-bottom:4px}
    .subtitle{font-size:10px;color:#aaa}
    .countdown{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
    .countdown-title{font-size:11px;color:#999;margin-bottom:8px}
    .timer{font-family:"SF Mono",Monaco,monospace;font-size:24px;font-weight:600;color:#333;letter-spacing:1px}
    .timer span{color:#f57c00}
    .btn{padding:10px;border:none;background:#f57c00;color:#fff;font-size:12px;font-weight:500;border-radius:6px;margin-top:auto;cursor:pointer;width:100%}
  </style>
</head>
<body>
  <div class="app">
    <div class="nav">
      <div class="logo"></div>
      <div class="user">用户: <strong>FENGWEI</strong></div>
    </div>
    <div class="hero">
      <div class="title">再见-世界</div>
      <div class="subtitle">从 1972-11-18 到 2063-11-18</div>
    </div>
    <div class="countdown">
      <div class="countdown-title">倒计时（2063-11-18 12:00:00）</div>
      <div class="timer" id="timer">计算中...</div>
    </div>
    <button class="btn" onclick="alert('演示登录成功')">微笑面对</button>
  </div>
  <script>
    const target = new Date('2063-11-18T12:00:00+08:00').getTime();
    function update() {
      const now = new Date().getTime();
      const diff = target - now;
      if (diff <= 0) {
        document.getElementById('timer').textContent = '00:00:00';
        return;
      }
      const years = Math.floor(diff / (1000*60*60*24*365));
      const months = Math.floor((diff % (1000*60*60*24*365)) / (1000*60*60*24*30));
      const days = Math.floor((diff % (1000*60*60*24*30)) / (1000*60*60*24));
      const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
      const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
      const secs = Math.floor((diff % (1000*60)) / 1000);
      document.getElementById('timer').innerHTML = 
        `<span>${years}</span>年<span>${months}</span>月<span>${days}</span>日<br>` +
        `<span>${String(hours).padStart(2,'0')}</span>:<span>${String(mins).padStart(2,'0')}</span>:<span>${String(secs).padStart(2,'0')}</span>`;
    }
    update();setInterval(update,1000);
  </script>
</body>
</html>
